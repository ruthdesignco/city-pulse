name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npx tsc -p tsconfig.functions.json --noEmit
      - run: npm test

  sql-fixture:
    name: SQL fixtures
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # anon/authenticated/service_role aren't real roles on plain Postgres;
      # only the migrations that define schema (not cron or vault, which need
      # the Supabase platform's own extensions) run here. See the comment at
      # the top of the fixture test for how to run this by hand.
      - run: psql "$PGURL" -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; create role service_role;"
      - run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261018200000_ingest_schema.sql \
            -f supabase/migrations/20261019030000_current_state_filters.sql \
            -f supabase/migrations/20261019050000_prune_relative_to_newest.sql \
            -f supabase/migrations/20261019070000_healthcheck_ping.sql \
            -f supabase/migrations/20261019080000_log_healthcheck_ping_failures.sql \
            -f supabase/tests/current_state.test.sql \
            -f supabase/tests/healthcheck_ping.test.sql
