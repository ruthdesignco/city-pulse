name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npx tsc -p tsconfig.functions.json --noEmit
      - run: npm test

  sql-fixture:
    name: SQL fixtures
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # anon/authenticated/service_role aren't real roles on plain Postgres.
      # Every migration runs except the platform-only ones, then every test
      # (scripts/sql-fixture-files.sh); see the comment at the top of the
      # fixture test for how to run this by hand.
      - run: psql "$PGURL" -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; create role service_role;"
      - run: psql "$PGURL" -v ON_ERROR_STOP=1 $(scripts/sql-fixture-files.sh)
